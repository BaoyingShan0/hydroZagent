<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: pideck-bg: hydrozagent-bg: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; frame-src 'self' file: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <style>
      /* 启动画面：独立于 #root，React 挂载后淡出移除；不依赖外部字体/图片，保证首帧极快。 */
      /* 注意：reset 必须限定在 boot-overlay 内——全局 * 规则是无层级的，
         会压过 Tailwind @layer utilities 的所有间距工具类（#115 曾因此导致菜单/弹窗无内边距）。 */
      #boot-overlay, #boot-overlay * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --hydro-qing: #5b6a76;
        --hydro-lake: #6fafc0;
        --hydro-vermilion: #c94f45;
        --hydro-rice: #f7f8f7;
      }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--hydro-rice);
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        overflow: hidden;
        background: var(--hydro-rice);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      #boot-overlay::before {
        content: "";
        position: absolute;
        top: -280px;
        left: 50%;
        width: 680px;
        height: 680px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: color-mix(in srgb, var(--hydro-lake) 10%, transparent);
        pointer-events: none;
      }
      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-logo {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: var(--hydro-qing);
        box-shadow:
          0 1px 0 color-mix(in srgb, #fff 18%, transparent) inset,
          0 14px 32px color-mix(in srgb, #000 12%, transparent);
      }
      .boot-logo::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 28px;
        border: 1px solid color-mix(in srgb, var(--hydro-qing) 18%, transparent);
        animation: boot-ring 1.8s ease-out infinite;
        pointer-events: none;
      }
      .boot-logo svg {
        width: 48px;
        height: 48px;
      }

      .boot-title {
        color: var(--hydro-qing);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.08em;
        font-family: "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei UI", system-ui, sans-serif;
        line-height: 1.1;
      }
      .boot-subtitle {
        color: color-mix(in srgb, var(--hydro-qing) 72%, transparent);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.35;
      }

      .boot-progress {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--hydro-qing) 10%, transparent);
        overflow: hidden;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--hydro-lake);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-ring {
        0% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        70% {
          opacity: 0;
          transform: scale(1.08);
        }
        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-logo::after,
        .boot-progress-bar {
          animation: none !important;
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：React 挂载后通过 fade-out 动画淡出再移除 -->
    <div id="boot-overlay">
      <div class="boot-brand">
        <div class="boot-logo">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <path d="M60 17c-13 18-29 34-29 54a29 29 0 0 0 58 0c0-20-16-36-29-54Z" fill="none" stroke="#f7f8f7" stroke-width="5" stroke-linejoin="round"/>
            <path d="M40 60c9-7 18-7 27 0s18 7 27 0M36 72c10-7 20-7 30 0s20 7 30 0M41 84c8-5 16-5 24 0s16 5 24 0" fill="none" stroke="#f7f8f7" stroke-width="5" stroke-linecap="round"/>
            <circle cx="60" cy="44" r="4" fill="#c94f45"/>
          </svg>
        </div>
        <strong class="boot-title">浙水智能体</strong>
        <span class="boot-subtitle">AI 赋能水利 · 智慧守护江河</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
