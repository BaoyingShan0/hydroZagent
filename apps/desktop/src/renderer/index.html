<!doctype html>
<!-- 品牌基线：首帧即挂 classic-green 外观，避免 React/设置回填前退回 foundation 浅色默认
     （深青侧栏、品牌文本墨色等全失效）。App 挂载后 applyAppearanceAttributes 会按用户设置覆盖。 -->
<html
  lang="zh-CN"
  data-appearance="classic-green"
  data-theme="light"
  data-accent="default"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: pideck-bg: hydrozagent-bg: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; frame-src 'self' file: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <style>
      /* 启动画面：独立于 #root，React 挂载后淡出移除；品牌背景由 Vite 随渲染层产物打包。 */
      /* 注意：reset 必须限定在 boot-overlay 内——全局 * 规则是无层级的，
         会压过 Tailwind @layer utilities 的所有间距工具类（#115 曾因此导致菜单/弹窗无内边距）。 */
      #boot-overlay, #boot-overlay * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --hydro-qing: #5b6a76;
        --hydro-lake: #6fafc0;
        --hydro-vermilion: #c94f45;
        --hydro-rice: #f7f8f7;
      }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--hydro-rice);
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        overflow: hidden;
        background: var(--hydro-rice);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }

      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .boot-brand {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* 启动页 logo：与新建对话页 HydroWelcomeHeader 同源同参数
         （148px / max-w-44vw / object-contain / mix-blend-mode: multiply），
         直接复用 hydrozagent-logo.png 小机器人主标。 */
      .boot-logo-img {
        width: 148px;
        max-width: 44vw;
        height: auto;
        object-fit: contain;
        mix-blend-mode: multiply;
        user-select: none;
      }

      .boot-title {
        color: var(--hydro-qing);
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-family: "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei UI", system-ui, sans-serif;
        line-height: 42px;
      }
      .boot-subtitle {
        color: color-mix(in srgb, var(--hydro-qing) 72%, transparent);
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.06em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 24px;
      }
      .boot-brand-name {
        color: color-mix(in srgb, var(--hydro-qing) 50%, transparent);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1;
      }

      /* 版权署名：贴底居中、弱化处理，随品牌区一起上浮出现。 */
      .boot-copyright {
        position: absolute;
        inset-inline: 0;
        bottom: 20px;
        z-index: 1;
        padding: 0 16px;
        text-align: center;
        color: color-mix(in srgb, var(--hydro-qing) 45%, transparent);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 1.5;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 160ms both;
      }

      .boot-progress {
        position: relative;
        z-index: 1;
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--hydro-qing) 10%, transparent);
        overflow: hidden;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }

      /* 与新建对话页共用 42vh / 40% 透明度 / 顶部渐隐的江南水系背景参数。 */
      .boot-backdrop {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        z-index: 0;
        width: 100%;
        height: 42vh;
        object-fit: cover;
        object-position: bottom;
        opacity: 0.4;
        pointer-events: none;
        user-select: none;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 38%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 38%);
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--hydro-lake);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-progress-bar {
          animation: none !important;
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：React 挂载后通过 fade-out 动画淡出再移除 -->
    <div id="boot-overlay">
      <img
        class="boot-backdrop"
        src="/src/assets/brand/boot-backdrop.png"
        alt=""
        aria-hidden="true"
      />
      <div class="boot-brand">
        <img
          class="boot-logo-img"
          src="/src/assets/brand/hydrozagent-logo.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
        <strong class="boot-title">浙水智能体</strong>
        <span class="boot-subtitle">AI 赋能水利 · 智慧守护江河</span>
        <span class="boot-brand-name">hydrozagent</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
      <span class="boot-copyright">© 2026 浙江省水利河口研究院（浙江省海洋规划设计研究院）</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
